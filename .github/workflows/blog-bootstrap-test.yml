name: Ratgeber-Grundstruktur auf Testdomain

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blog-bootstrap-test
  cancel-in-progress: false

jobs:
  deploy-ratgeber-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FTP_HOST: ${{ vars.FTP_HOST }}
      FTP_USER: ${{ vars.FTP_USER }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_TEST_DIRECTORY: ${{ vars.FTP_TEST_DIRECTORY }}
      FTP_LIVE_DIRECTORY: ${{ vars.FTP_LIVE_DIRECTORY }}
      TEST_SITE_URL: ${{ vars.TEST_SITE_URL }}
      LIVE_SITE_URL: ${{ vars.LIVE_SITE_URL }}

    steps:
      - name: Repository laden
        uses: actions/checkout@v5

      - name: Node.js einrichten
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Ratgeber-Export erstellen
        run: npm run build

      - name: Ratgeber-Export prüfen
        run: npm run verify:blog-export -- krankenfahrt-oder-krankentransport-unterschied

      - name: Ratgeber-Grundstruktur auf Testdomain übertragen
        run: npm run deploy:blog:test -- krankenfahrt-oder-krankentransport-unterschied
