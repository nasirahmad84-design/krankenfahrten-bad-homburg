name: Ratgeber-Grundstruktur auf Testdomain

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blog-bootstrap-test
  cancel-in-progress: false

jobs:
  deploy-ratgeber-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FTP_HOST: ${{ vars.FTP_HOST }}
      FTP_USER: ${{ vars.FTP_USER }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_TEST_DIRECTORY: ${{ vars.FTP_TEST_DIRECTORY }}
      FTP_LIVE_DIRECTORY: ${{ vars.FTP_LIVE_DIRECTORY }}
      TEST_SITE_URL: ${{ vars.TEST_SITE_URL }}
      LIVE_SITE_URL: ${{ vars.LIVE_SITE_URL }}

    steps:
      - name: Repository laden
        uses: actions/checkout@v5

      - name: Node.js einrichten
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Statischen Export erstellen und prüfen
        run: |
          npm run build
          npm run verify:blog-export -- krankenfahrt-oder-krankentransport-unterschied

      - name: Seitenbasis mit Ratgeber-Navigation gezielt übertragen
        run: |
          set -Eeuo pipefail
          remote_directory="/${FTP_TEST_DIRECTORY#/}"
          remote_directory="${remote_directory%/}/"
          ftp_base="ftp://${FTP_HOST}${remote_directory}"

          upload_file() {
            local file="$1"
            local relative_path="${file#out/}"
            local encoded_path
            encoded_path="$(RELATIVE_PATH="$relative_path" node -e 'process.stdout.write(process.env.RELATIVE_PATH.split("/").map(encodeURIComponent).join("/"))')"
            curl --silent --show-error --fail \
              --tls-max 1.2 --ssl-reqd --ftp-ssl-control --ftp-create-dirs --ftp-pasv \
              --retry 3 --retry-all-errors --retry-delay 2 \
              --user "${FTP_USER}:${FTP_PASSWORD}" \
              --upload-file "$file" \
              "${ftp_base}${encoded_path}"
          }

          while IFS= read -r -d '' file; do
            upload_file "$file"
          done < <(find out -type f \( -name '*.html' -o -name '__next*.txt' \) -print0)

          upload_file out/sitemap.xml

      - name: Testdomain prüfen
        run: |
          set -Eeuo pipefail
          hub="${TEST_SITE_URL%/}/ratgeber/"
          article="${TEST_SITE_URL%/}/ratgeber/krankenfahrt-oder-krankentransport-unterschied/"
          draft="${TEST_SITE_URL%/}/ratgeber/krankenfahrt-anfragen-welche-angaben/"

          curl --silent --show-error --fail --location "$hub" | grep -Fq 'Krankenfahrten verständlich erklärt'
          curl --silent --show-error --fail --location "$article" | grep -Fq 'Krankenfahrt oder Krankentransport'
          curl --silent --show-error --fail --location "${TEST_SITE_URL%/}/" | grep -Fq 'href="/ratgeber"'
          curl --silent --show-error --head "$hub" | grep -Eiq '^x-robots-tag: noindex, nofollow, noarchive'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "$draft")" = '404'
