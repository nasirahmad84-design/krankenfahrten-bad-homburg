name: Redaktionscockpit auf Testdomain

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: editorial-cockpit-test
  cancel-in-progress: false

jobs:
  deploy-editorial-cockpit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FTP_HOST: ${{ vars.FTP_HOST }}
      FTP_USER: ${{ vars.FTP_USER }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_TEST_DIRECTORY: ${{ vars.FTP_TEST_DIRECTORY }}
      TEST_SITE_URL: ${{ vars.TEST_SITE_URL }}
      EDITORIAL_LOGIN_EMAIL: ${{ secrets.EDITORIAL_LOGIN_EMAIL }}

    steps:
      - name: Repository laden
        uses: actions/checkout@v5

      - name: Node.js einrichten
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Vorhandenes Cockpit sichern
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/editorial-backup"
          for item in index.php content.php .htaccess login-config.php lib/auth.php assets/editorial.css assets/logo.svg; do
            mkdir -p "$RUNNER_TEMP/editorial-backup/$(dirname "$item")"
            curl --silent --show-error --fail --connect-timeout 20 --max-time 60 --ftp-pasv --disable-epsv --ssl-reqd --ftp-ssl-control --tls-max 1.2 \
              --user "$FTP_USER:$FTP_PASSWORD" \
              "ftp://$FTP_HOST/${FTP_TEST_DIRECTORY#/}redaktion/$item" \
              --output "$RUNNER_TEMP/editorial-backup/$item"
          done

      - name: Wiederherstellbare Sicherung aufbewahren
        uses: actions/upload-artifact@v4
        with:
          name: editorial-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/editorial-backup/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

      - name: Redaktionscockpit mit Einmalcode-Login übertragen
        # Backup must be recoverable before the first overwrite.
        if: success()
        run: npm run deploy:editorial:test

      - name: Ergebnis zusammenfassen
        if: always()
        run: |
          {
            echo "## Redaktionscockpit"
            echo "- Ziel: ${TEST_SITE_URL%/}/redaktion/"
            echo "- Enthalten: vorbereitete Artikel, Quellen, Claims und Google-Business-Entwürfe"
            echo "- Zugang: serverseitiger Einmalcode an das hinterlegte interne Postfach"
            echo "- Produktion: nicht verändert"
          } >> "$GITHUB_STEP_SUMMARY"
