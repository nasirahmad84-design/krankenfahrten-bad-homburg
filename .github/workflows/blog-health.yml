name: Blog-Publisher-Gesundheit

on:
  schedule:
    - cron: "43 17 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Tatsächlichen Publisher-Lauf und Redaktionsvorrat prüfen
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-blog-health.mjs
      - name: Google-Versandstatus laden
        if: vars.GBP_QUEUE_ENABLED == 'true'
        run: |
          git fetch origin gbp-state
          git worktree add --detach "$RUNNER_TEMP/gbp-state" FETCH_HEAD
      - name: Google-Start und fällige Beiträge prüfen
        if: vars.GBP_QUEUE_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GBP_STATE_DIRECTORY: ${{ runner.temp }}/gbp-state
        run: node scripts/check-google-business-health.mjs
