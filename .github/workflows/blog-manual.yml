name: Geplanter Blog-Queue-Release

on:
  schedule:
    - cron: "0 7 * * 1,4"
  workflow_dispatch:
    inputs:
      publication_date:
        description: "Optionales Veröffentlichungsdatum im Format YYYY-MM-DD"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: blog-publishing
  cancel-in-progress: false

jobs:
  publish-approved-queue-item:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BLOG_PUBLICATION_DATE: ${{ inputs.publication_date }}
      FTP_HOST: ${{ vars.FTP_HOST }}
      FTP_USER: ${{ vars.FTP_USER }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_TEST_DIRECTORY: ${{ vars.FTP_TEST_DIRECTORY }}
      FTP_LIVE_DIRECTORY: ${{ vars.FTP_LIVE_DIRECTORY }}
      TEST_SITE_URL: ${{ vars.TEST_SITE_URL }}
      LIVE_SITE_URL: ${{ vars.LIVE_SITE_URL }}

    steps:
      - name: Repository laden
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Node.js einrichten
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Freigegebenen Warteschlangenartikel auswählen
        id: queue
        run: npm run blog:select-scheduled

      - name: Blog-Delta vorbereiten
        if: steps.queue.outputs.status == 'ready'
        run: npm run blog:prepare-release -- "${{ steps.queue.outputs.run_directory }}"

      - name: Blog-Delta auf Testdomain veröffentlichen
        if: steps.queue.outputs.status == 'ready'
        run: npm run deploy:blog:test -- "${{ steps.queue.outputs.slug }}"

      - name: Erfolgreich getesteten Inhalt dokumentieren
        if: steps.queue.outputs.status == 'ready'
        run: |
          git config user.name "krankenfahrten-blog-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "automation/blog/published/${{ steps.queue.outputs.slug }}.json"
          git add src/content/generated-blog-posts.ts public/sitemap.xml
          git diff --cached --check
          git commit -m "feat: publish guide ${{ steps.queue.outputs.slug }}"
          git push origin HEAD:main

      - name: Gleiches Blog-Delta live veröffentlichen
        if: steps.queue.outputs.status == 'ready' && vars.BLOG_QUEUE_LIVE_ENABLED == 'true'
        env:
          BLOG_DEPLOY_LIVE_CONFIRM: JA
        run: npm run deploy:blog:live -- "${{ steps.queue.outputs.slug }}"

      - name: Ergebnis zusammenfassen
        if: always()
        run: |
          {
            echo "## Blog-Warteschlange"
            echo "- Datum: ${{ steps.queue.outputs.publication_date || inputs.publication_date || 'Europe/Berlin heute' }}"
            echo "- Status: ${{ steps.queue.outputs.status || 'abgebrochen' }}"
            if [[ "${{ steps.queue.outputs.status }}" == "ready" ]]; then
              echo "- Test-URL: https://test.krankenfahrten-bad-homburg.de/ratgeber/${{ steps.queue.outputs.slug }}/"
              echo "- Live-Freigabe: ${{ vars.BLOG_QUEUE_LIVE_ENABLED == 'true' }}"
            else
              echo "- Es wurde nichts veröffentlicht."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
