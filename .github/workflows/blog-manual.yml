name: Manueller Cloud-Bloglauf

on:
  workflow_dispatch:
    inputs:
      deploy_live:
        description: "Freigegebenen Artikel nach der Testdomain auch live veröffentlichen"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: blog-publishing
  cancel-in-progress: false

jobs:
  research-review-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BLOG_MODEL: gpt-5-mini
      FTP_HOST: ${{ vars.FTP_HOST }}
      FTP_USER: ${{ vars.FTP_USER }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_TEST_DIRECTORY: ${{ vars.FTP_TEST_DIRECTORY }}
      FTP_LIVE_DIRECTORY: ${{ vars.FTP_LIVE_DIRECTORY }}
      TEST_SITE_URL: ${{ vars.TEST_SITE_URL }}
      LIVE_SITE_URL: ${{ vars.LIVE_SITE_URL }}

    steps:
      - name: Repository laden
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Node.js einrichten
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Recherchieren und unabhängig prüfen
        id: editorial
        run: npm run blog:cloud-run

      - name: Freigegebenen Blogartikel vorbereiten
        if: steps.editorial.outputs.status == 'approved_for_publish'
        run: npm run blog:prepare-release -- "${{ steps.editorial.outputs.run_directory }}"

      - name: Freigegebenen Inhalt dokumentieren
        if: steps.editorial.outputs.status == 'approved_for_publish'
        run: |
          git config user.name "krankenfahrten-blog-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.editorial.outputs.run_directory }}"
          git add "automation/blog/published/${{ steps.editorial.outputs.slug }}.json"
          git add src/content/generated-blog-posts.ts public/sitemap.xml
          git diff --cached --check
          git commit -m "feat: publish guide ${{ steps.editorial.outputs.slug }}"
          git push origin HEAD:main

      - name: Blog-Delta auf Testdomain veröffentlichen
        if: steps.editorial.outputs.status == 'approved_for_publish'
        run: npm run deploy:blog:test -- "${{ steps.editorial.outputs.slug }}"

      - name: Gleiches Blog-Delta live veröffentlichen
        if: steps.editorial.outputs.status == 'approved_for_publish' && inputs.deploy_live
        env:
          BLOG_DEPLOY_LIVE_CONFIRM: JA
        run: npm run deploy:blog:live -- "${{ steps.editorial.outputs.slug }}"

      - name: Ergebnis zusammenfassen
        if: always()
        run: |
          {
            echo "## Cloud-Bloglauf"
            echo "- Status: ${{ steps.editorial.outputs.status || 'abgebrochen' }}"
            echo "- Run-ID: ${{ steps.editorial.outputs.run_id || 'nicht erzeugt' }}"
            if [[ "${{ steps.editorial.outputs.status }}" == "approved_for_publish" ]]; then
              echo "- Test-URL: https://test.krankenfahrten-bad-homburg.de/ratgeber/${{ steps.editorial.outputs.slug }}/"
              echo "- Live-Deployment: ${{ inputs.deploy_live }}"
            else
              echo "- Es wurde nichts veröffentlicht."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
